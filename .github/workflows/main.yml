
name: Windows C++ Build and Test

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Configure MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile C++ program
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 /Fe:industrial_sorting.exe industrial_sorting.cpp

      - name: Run industrial simulation
        shell: pwsh
        run: |
          .\industrial_sorting.exe
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify classification results
        shell: pwsh
        run: |
          $cinta1 = @(Get-Content 'cinta1.txt' | Where-Object { $_.Trim() })
          $cinta2 = @(Get-Content 'cinta2.txt' | Where-Object { $_.Trim() })
          $a = @(Get-Content 'ContA.txt' | Where-Object { $_.Trim() })
          $b = @(Get-Content 'ContB.txt' | Where-Object { $_.Trim() })
          $c = @(Get-Content 'ContC.txt' | Where-Object { $_.Trim() })

          $entradas = $cinta1.Count + $cinta2.Count
          $salidas = $a.Count + $b.Count + $c.Count

          Write-Host "Piezas de entrada: $entradas"
          Write-Host "Contenedor A: $($a.Count)"
          Write-Host "Contenedor B: $($b.Count)"
          Write-Host "Contenedor C: $($c.Count)"
          Write-Host "Piezas de salida: $salidas"

          if ($entradas -ne 28 -or $salidas -ne $entradas) {
            throw "Error: las entradas y salidas no coinciden."
          }

          Write-Host "Prueba superada: 28 piezas clasificadas."
